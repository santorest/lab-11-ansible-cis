  - {cis: "5.2.7", title: "Ensure the Group Used by pam_wheel.so Module Exists on System and is Empty", role: cis_access, rules: [ensure_pam_wheel_group_empty, use_pam_wheel_group_for_su]}
  - {cis: "5.3.1.3", title: "Install pam_pwquality Package", role: cis_access, rules: [package_pam_pwquality_installed]}
  - {cis: "5.3.2.2", title: "Ensure pam_faillock module is enabled", role: cis_access, rules: [accounts_passwords_pam_faillock_enabled]}
  - {cis: "5.3.2.3", title: "Verify pam_pwquality module is activated", role: cis_access, rules: [accounts_password_pam_pwquality_enabled]}
  - {cis: "5.3.2.4", title: "Verify pam_pwhistory module is activated", role: cis_access, rules: [accounts_password_pam_pwhistory_enabled]}
  - {cis: "5.3.3.1.1", title: "Lock Accounts After Failed Password Attempts", role: cis_access, rules: [accounts_passwords_pam_faillock_deny]}
  - {cis: "5.3.3.1.2", title: "Set Lockout Time for Failed Password Attempts", role: cis_access, rules: [accounts_passwords_pam_faillock_unlock_time]}
  - {cis: "5.3.3.3.1", title: "Limit Password Reuse", role: cis_access, rules: [accounts_password_pam_pwhistory_remember]}
  - {cis: "5.3.3.3.2", title: "Limit Password Reuse", role: cis_access, rules: [accounts_password_pam_pwhistory_enforce_root]}
  - {cis: "5.3.3.3.3", title: "Enforce Password History with use_authtok", role: cis_access, rules: [accounts_password_pam_pwhistory_use_authtok]}
  - {cis: "5.3.3.4.1", title: "Prevent Login to Accounts With Empty Password", role: cis_access, rules: [no_empty_passwords_unix]}

  - {cis: "4.2.7", title: "Ensure ufw Default Deny Firewall Policy", role: cis_firewall, rules: [set_ufw_default_rule]}
  - {cis: "5.1.1", title: "Verify Permissions on SSH Server config file", role: cis_access, rules: [file_permissions_sshd_config, file_permissions_sshd_drop_in_config]}
  - {cis: "5.1.4", title: "Limit Users' SSH Access", role: cis_access, rules: [sshd_limit_user_access]}
  - {cis: "5.1.5", title: "Enable SSH Warning Banner", role: cis_access, rules: [sshd_enable_warning_banner_net]}

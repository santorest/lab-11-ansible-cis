# What the roles claim to remediate: CIS id -> SSG rules (short ids from SSG v0.1.82, cis_level1_server).
# Built from the baseline scan of spike run 37054867659: every rule that failed on the default runner and that a
# role fixes. The gate fails if any of these rules still fails after hardening.
controls:
  - {cis: "1.1.1.1", title: "Disable Mounting of cramfs", role: cis_initial_setup, rules: [kernel_module_cramfs_disabled]}
  - {cis: "1.1.1.2", title: "Disable Mounting of freevxfs", role: cis_initial_setup, rules: [kernel_module_freevxfs_disabled]}
  - {cis: "1.1.1.3", title: "Disable Mounting of hfs", role: cis_initial_setup, rules: [kernel_module_hfs_disabled]}
  - {cis: "1.1.1.4", title: "Disable Mounting of hfsplus", role: cis_initial_setup, rules: [kernel_module_hfsplus_disabled]}
  - {cis: "1.1.1.5", title: "Disable Mounting of jffs2", role: cis_initial_setup, rules: [kernel_module_jffs2_disabled]}
  - {cis: "1.1.1.9", title: "Disable Modprobe Loading of USB Storage Driver", role: cis_initial_setup, rules: [kernel_module_usb-storage_disabled]}
  - {cis: "1.1.2.2.2", title: "Add nodev Option to /dev/shm", role: cis_initial_setup, rules: [mount_option_dev_shm_nodev]}
  - {cis: "1.1.2.2.3", title: "Add nosuid Option to /dev/shm", role: cis_initial_setup, rules: [mount_option_dev_shm_nosuid]}
  - {cis: "1.1.2.2.4", title: "Add noexec Option to /dev/shm", role: cis_initial_setup, rules: [mount_option_dev_shm_noexec]}
  - {cis: "1.3.1.1", title: "Ensure AppArmor Utils is installed", role: cis_initial_setup, rules: [package_apparmor-utils_installed]}
  - {cis: "1.3.1.2", title: "Ensure AppArmor is enabled in the bootloader configuration", role: cis_initial_setup, rules: [grub2_enable_apparmor]}
  - {cis: "1.3.1.3", title: "All AppArmor Profiles are in enforce or complain mode", role: cis_initial_setup, rules: [all_apparmor_profiles_in_enforce_complain_mode]}
  - {cis: "1.4.1", title: "Set Boot Loader Password in grub2", role: cis_initial_setup, rules: [grub2_password, grub2_uefi_password]}
  - {cis: "1.5.1", title: "Enable Randomized Layout of Virtual Address Space", role: cis_initial_setup, rules: [sysctl_kernel_randomize_va_space]}
  - {cis: "1.5.3", title: "Disable Core Dumps for All Users", role: cis_initial_setup, rules: [disable_users_coredumps, sysctl_fs_suid_dumpable]}
  - {cis: "1.6.2", title: "Ensure Local Login Warning Banner Is Configured Properly", role: cis_initial_setup, rules: [banner_etc_issue_cis]}
  - {cis: "1.6.3", title: "Ensure Remote Login Warning Banner Is Configured Properly", role: cis_initial_setup, rules: [banner_etc_issue_net_cis]}
  - {cis: "2.1.13", title: "Uninstall rsync Package", role: cis_services, rules: [package_rsync_removed, service_rsyncd_disabled]}
  - {cis: "2.1.18", title: "Uninstall apache2 Package", role: cis_services, rules: [package_httpd_removed, service_httpd_disabled, package_nginx_removed, service_nginx_disabled]}
  - {cis: "2.2.4", title: "Remove telnet Clients", role: cis_services, rules: [package_inetutils-telnet_removed, package_telnet_removed]}
  - {cis: "2.2.6", title: "Remove ftp Package", role: cis_services, rules: [package_ftp_removed, package_tnftp_removed]}
  - {cis: "2.3.1.1", title: "Install the systemd_timesyncd Service", role: cis_services, rules: [package_timesyncd_installed, service_chronyd_disabled]}
  - {cis: "2.4.1.2", title: "Verify Permissions on crontab", role: cis_services, rules: [file_permissions_crontab]}
  - {cis: "2.4.1.3", title: "Verify Permissions on cron.hourly", role: cis_services, rules: [file_permissions_cron_hourly]}
  - {cis: "2.4.1.4", title: "Verify Permissions on cron.daily", role: cis_services, rules: [file_permissions_cron_daily]}
  - {cis: "2.4.1.5", title: "Verify Permissions on cron.weekly", role: cis_services, rules: [file_permissions_cron_weekly]}
  - {cis: "2.4.1.6", title: "Verify Permissions on cron.monthly", role: cis_services, rules: [file_permissions_cron_monthly]}
  - {cis: "2.4.1.7", title: "Verify Permissions on cron.d", role: cis_services, rules: [file_permissions_cron_d]}
  - {cis: "2.4.1.8", title: "Ensure that /etc/cron.allow exists", role: cis_services, rules: [file_cron_allow_exists]}
  - {cis: "2.4.2.1", title: "Ensure that /etc/at.allow exists", role: cis_services, rules: [file_at_allow_exists]}

  - {cis: "5.1.14", title: "Set LogLevel to INFO", role: cis_access, rules: [sshd_set_loglevel_info]}
  - {cis: "5.1.15", title: "Use Only Strong MACs", role: cis_access, rules: [sshd_use_strong_macs]}
  - {cis: "5.1.16", title: "Set SSH authentication attempt limit", role: cis_access, rules: [sshd_set_max_auth_tries]}
  - {cis: "5.1.17", title: "Set SSH MaxSessions limit", role: cis_access, rules: [sshd_set_max_sessions]}
  - {cis: "5.1.18", title: "Ensure SSH MaxStartups is configured", role: cis_access, rules: [sshd_set_maxstartups]}
  - {cis: "5.1.19", title: "Disable SSH Access via Empty Passwords", role: cis_access, rules: [sshd_disable_empty_passwords]}
  - {cis: "5.1.20", title: "Disable SSH Root Login", role: cis_access, rules: [sshd_disable_root_login]}
  - {cis: "5.1.21", title: "Do Not Allow SSH Environment Options", role: cis_access, rules: [sshd_do_not_permit_user_env]}

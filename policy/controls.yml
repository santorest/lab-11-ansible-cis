  - {cis: "3.3.5", title: "Disable Accepting ICMP Redirects for All IPv6 Interfaces", role: cis_network, rules: [sysctl_net_ipv6_conf_all_accept_redirects, sysctl_net_ipv6_conf_default_accept_redirects, sysctl_net_ipv4_conf_default_accept_redirects]}
  - {cis: "3.3.6", title: "Disable Kernel Parameter for Accepting Secure ICMP Redirects on all IPv4 Interfaces", role: cis_network, rules: [sysctl_net_ipv4_conf_all_secure_redirects, sysctl_net_ipv4_conf_default_secure_redirects]}
  - {cis: "3.3.7", title: "Enable Kernel Parameter to Use Reverse Path Filtering on all IPv4 Interfaces", role: cis_network, rules: [sysctl_net_ipv4_conf_all_rp_filter, sysctl_net_ipv4_conf_default_rp_filter]}
  - {cis: "3.3.8", title: "Disable Kernel Parameter for Accepting Source-Routed Packets on all IPv6 Interfaces", role: cis_network, rules: [sysctl_net_ipv6_conf_all_accept_source_route, sysctl_net_ipv6_conf_default_accept_source_route, sysctl_net_ipv4_conf_all_accept_source_route, sysctl_net_ipv4_conf_default_accept_source_route]}
  - {cis: "3.3.9", title: "Enable Kernel Parameter to Log Martian Packets on all IPv4 Interfaces", role: cis_network, rules: [sysctl_net_ipv4_conf_all_log_martians, sysctl_net_ipv4_conf_default_log_martians]}
  - {cis: "3.3.10", title: "Enable Kernel Parameter to Use TCP Syncookies on Network Interfaces", role: cis_network, rules: [sysctl_net_ipv4_tcp_syncookies]}
  - {cis: "3.3.11", title: "Configure Accepting Router Advertisements on All IPv6 Interfaces", role: cis_network, rules: [sysctl_net_ipv6_conf_all_accept_ra, sysctl_net_ipv6_conf_default_accept_ra]}
  - {cis: "4.2.3", title: "Verify ufw Active", role: cis_firewall, rules: [check_ufw_active]}

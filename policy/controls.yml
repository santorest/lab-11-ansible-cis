  - {cis: "5.4.2.5", title: "Ensure that Root's Path Does Not Include World or Group-Writable Directories", role: cis_access, rules: [accounts_root_path_dirs_no_write, root_path_all_dirs]}
  - {cis: "5.4.2.7", title: "Ensure that System Accounts Do Not Run a Shell Upon Login", role: cis_access, rules: [no_shelllogin_for_systemaccounts]}
  - {cis: "5.4.3.2", title: "Set Interactive Session Timeout", role: cis_access, rules: [accounts_tmout]}
  - {cis: "5.4.3.3", title: "Ensure the Default Bash Umask is Set Correctly", role: cis_access, rules: [accounts_umask_etc_bashrc, accounts_umask_etc_login_defs, accounts_umask_etc_profile]}

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cisreport"
version = "1.0.0"
description = "Compare OpenSCAP CIS scans before/after Ansible hardening and gate on the result (portfolio lab 11)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["defusedxml>=0.7", "PyYAML>=6.0"]

[project.scripts]
cisreport = "cisreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["cisreport"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["roles", ".ansible"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

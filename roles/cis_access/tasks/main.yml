- name: Directories this role writes into exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  # /run/sshd: sshd -t refuses to validate without it, and it is missing while sshd has not run
  # (socket-activated on the runner, never started in the Molecule container)
  loop: ["/etc/ssh/sshd_config.d", "/run/sshd"]
  tags: [cis_access]

# Pre-flight against lockout: after the drop-in, root cannot log in over SSH and only AllowGroups members can
- name: 5.1.x | groups of the admin account this play connects as
  ansible.builtin.command: id -nG {{ cis_access_admin_user | quote }}
  register: cis_access_admin_groups
  changed_when: false
  when: "'5.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_1, cis_access, molecule-notest]

- name: 5.1.x | that admin keeps SSH access (not root, member of an allowed group)
  ansible.builtin.assert:
    that:
      - cis_access_admin_user != 'root' or cis_access_sshd.PermitRootLogin != 'no'
      - cis_access_admin_groups.stdout.split() | intersect(cis_access_ssh_allow_groups) | length > 0
    fail_msg: >-
      {{ cis_access_admin_user }} (groups: {{ cis_access_admin_groups.stdout }}) would lose SSH access: allowed groups
      are {{ cis_access_ssh_allow_groups | join(', ') }} and PermitRootLogin is {{ cis_access_sshd.PermitRootLogin }}.
      Set cis_access_admin_user or cis_access_ssh_allow_groups before hardening.
    quiet: true
  when: "'5.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_1, cis_access, molecule-notest]

- name: 5.1.x | sshd settings in a drop-in that sshd reads first (first value wins)
  ansible.builtin.template:
    src: 00-cis.conf.j2
    dest: /etc/ssh/sshd_config.d/00-cis.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
  when: "'5.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_1, cis_access]

- name: 5.1.1 | sshd configuration files are root-only (find drop-ins)
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
  register: cis_access_sshd_dropins
  when: "'5.1.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_1_1, cis_access]

- name: 5.1.1 | sshd configuration files are root-only
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ ['/etc/ssh/sshd_config'] + (cis_access_sshd_dropins.files | default([]) | map(attribute='path') | list) }}"
  when: "'5.1.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_1_1, cis_access]

- name: 5.2.x | sudo uses a pty, logs to a file, re-authenticates after 15 minutes, uses a clean PATH
  ansible.builtin.template:
    src: 60-cis-sudoers.j2
    dest: /etc/sudoers.d/60-cis
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: "'5.2' not in (cis_exception_ids | default([]))"
  tags: [cis_5_2, cis_access]

- name: 5.2.7 | the group allowed to use su exists and is empty
  ansible.builtin.group:
    name: "{{ cis_access_su_group }}"
    state: present
  when: "'5.2.7' not in (cis_exception_ids | default([]))"
  tags: [cis_5_2_7, cis_access]

- name: 5.2.7 | su is restricted to that group
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*#?\s*auth\s+required\s+pam_wheel\.so'
    line: "auth       required   pam_wheel.so use_uid group={{ cis_access_su_group }}"
    insertafter: '^auth\s+sufficient\s+pam_rootok\.so'
  when: "'5.2.7' not in (cis_exception_ids | default([]))"
  tags: [cis_5_2_7, cis_access]

- name: 5.3.1.3 | pam_pwquality is installed
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present
  when: "'5.3.1.3' not in (cis_exception_ids | default([]))"
  tags: [cis_5_3_1, cis_access]

# In pwquality.conf itself: the profile's checks read that file only, not pwquality.conf.d
- name: 5.3.3.2.x | password quality settings
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^\s*#?\s*{{ item.key }}\b'
    line: "{{ item.key }}{{ '' if item.value is none else ' = ' ~ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cis_access_pwquality | dict2items }}"
  when: "'5.3.3.2' not in (cis_exception_ids | default([]))"
  tags: [cis_5_3_3_2, cis_access]

- name: 5.3.3.1.x | account lockout settings (faillock)
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    content: "deny = 4\nunlock_time = 900\neven_deny_root\nroot_unlock_time = 60\n"
    owner: root
    group: root
    mode: "0644"
  when: "'5.3.3.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_3_3_1, cis_access]

- name: 5.3.2.x | PAM profiles for faillock and password history
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/share/pam-configs/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [cis-faillock, cis-faillock-notify, cis-pwhistory]
  notify: Update PAM
  when: "'5.3.2' not in (cis_exception_ids | default([]))"
  tags: [cis_5_3_2, cis_access]

- name: 5.3.3.4.1 | pam_unix does not accept empty passwords (nullok removed from its profile)
  ansible.builtin.replace:
    path: /usr/share/pam-configs/unix
    regexp: '\s+nullok\b'
    replace: ""
  notify: Update PAM
  when: "'5.3.3.4' not in (cis_exception_ids | default([]))"
  tags: [cis_5_3_3_4, cis_access]

- name: 5.4.1.x | password ageing and umask defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*#?\s*{{ item.key }}\s'
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - {key: PASS_MAX_DAYS, value: "{{ cis_access_pass_max_days }}"}
    - {key: PASS_MIN_DAYS, value: "{{ cis_access_pass_min_days }}"}
    - {key: PASS_WARN_AGE, value: "{{ cis_access_pass_warn_age }}"}
    - {key: ENCRYPT_METHOD, value: YESCRYPT}
    - {key: UMASK, value: "027"}
  when: "'5.4.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_1, cis_access]

- name: 5.4.1.5 | inactive password lock for new accounts
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^\s*#?\s*INACTIVE='
    line: "INACTIVE={{ cis_access_inactive_days }}"
  when: "'5.4.1.5' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_1_5, cis_access]

# Accounts whose password is already older than the maximum would expire at once (breaking service accounts and
# sudo for automation): they are listed for their owners, not changed.
- name: 5.4.1.1 | accounts with a password above the maximum age (find; "late" ones would expire at once)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F: -v max={{ cis_access_pass_max_days }} -v today=$(( $(date +%s) / 86400 )) \
        '$2 !~ /^[!*]/ && $2 != "" && ($5 == "" || $5 > max) {print ($3 != "" && $3 + max < today ? "late " : "ok ") $1}' \
        /etc/shadow
    executable: /bin/bash
  register: cis_access_long_lived
  changed_when: false
  when: "'5.4.1.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_1_1, cis_access]

- name: 5.4.1.1 | existing passwords expire within the maximum age
  ansible.builtin.command: chage --maxdays {{ cis_access_pass_max_days }} {{ item.split()[1] | quote }}
  loop: "{{ cis_access_long_lived.stdout_lines | default([]) | select('match', '^ok ') | list }}"
  changed_when: true
  when: "'5.4.1.1' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_1_1, cis_access]

- name: 5.4.1.1 | accounts left for their owners (password older than the maximum age)
  ansible.builtin.debug:
    msg: "Not changed, would expire at once: {{ cis_access_long_lived.stdout_lines | select('match', '^late ')
          | map('regex_replace', '^late ', '') | join(', ') }}"
  when:
    - "'5.4.1.1' not in (cis_exception_ids | default([]))"
    - cis_access_long_lived.stdout_lines | default([]) | select('match', '^late ') | list | length > 0
  tags: [cis_5_4_1_1, cis_access]

- name: 5.4.2.7 | system accounts with a login shell (find)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F: '$3 < 1000 && $1 !~ /^(root|sync|shutdown|halt)$/ && $7 !~ /(nologin|false)$/ {print $1}' /etc/passwd
    executable: /bin/bash
  register: cis_access_system_shells
  changed_when: false
  when: "'5.4.2.7' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_2_7, cis_access]

- name: 5.4.2.7 | system accounts cannot log in
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
  loop: "{{ cis_access_system_shells.stdout_lines | default([]) }}"
  when: "'5.4.2.7' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_2_7, cis_access]

# The runner image ships /usr/local/bin as 1777; root's PATH must not contain group- or world-writable directories
- name: 5.4.2.5 | directories in root's PATH are not writable by group or others
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find {{ cis_access_sudo_secure_path.split(':') | map('quote') | join(' ') }} -maxdepth 0 -type d -perm /022
      -print -exec chmod go-w {} + | wc -l
    executable: /bin/bash
  register: cis_access_root_path_dirs
  changed_when: cis_access_root_path_dirs.stdout | int > 0
  when: "'5.4.2.5' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_2_5, cis_access]

- name: 5.4.3.2 | interactive shells time out
  ansible.builtin.copy:
    dest: /etc/profile.d/60-cis-tmout.sh
    content: "TMOUT={{ cis_access_shell_timeout }}\nreadonly TMOUT\nexport TMOUT\n"
    owner: root
    group: root
    mode: "0644"
  when: "'5.4.3.2' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_3_2, cis_access]

- name: 5.4.3.3 | the default umask is 027 for login and interactive shells
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^\s*umask\s+\d+'
    line: "umask 027"
  loop: [/etc/profile, /etc/bash.bashrc]
  when: "'5.4.3.3' not in (cis_exception_ids | default([]))"
  tags: [cis_5_4_3_3, cis_access]

- name: Directories this role writes into exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["/etc/systemd/journald.conf.d"]
  tags: [cis_logging]

- name: 6.1.3.3 | journald forwards to rsyslog (the profile's logging path is rsyslog)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-cis.conf
    content: "[Journal]\nForwardToSyslog=yes\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  when: "'6.1.3.3' not in (cis_exception_ids | default([]))"
  tags: [cis_6_1_3_3, cis_logging]

- name: 6.1.4.1 | log files that are group-writable or readable by others (find)
  ansible.builtin.command: find /var/log -type f -perm /g+wx,o+rwx
  register: cis_logging_loose_logs
  changed_when: false
  when: "'6.1.4.1' not in (cis_exception_ids | default([]))"
  tags: [cis_6_1_4_1, cis_logging, molecule-notest]

- name: 6.1.4.1 | log files are not group-writable and not readable by others
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "g-wx,o-rwx"
  loop: "{{ cis_logging_loose_logs.stdout_lines | default([]) }}"
  when: "'6.1.4.1' not in (cis_exception_ids | default([]))"
  tags: [cis_6_1_4_1, cis_logging, molecule-notest]

# Service accounts (UID < 1000) keep the logs they write (postgres, www-data...); files of regular users or of no
# known user are given to root.
- name: 6.1.4.1 | log files owned by a regular user or by no known user (find)
  ansible.builtin.command: find /var/log -type f ( -uid +999 ! -user nobody -o -nouser )
  register: cis_logging_foreign_logs
  changed_when: false
  when: "'6.1.4.1' not in (cis_exception_ids | default([]))"
  tags: [cis_6_1_4_1, cis_logging, molecule-notest]

- name: 6.1.4.1 | those log files are owned by root
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
  loop: "{{ cis_logging_foreign_logs.stdout_lines | default([]) }}"
  when: "'6.1.4.1' not in (cis_exception_ids | default([]))"
  tags: [cis_6_1_4_1, cis_logging, molecule-notest]

- name: 6.3.1 | AIDE is installed
  ansible.builtin.apt:
    name: [aide, aide-common]
    state: present
  when: "cis_logging_aide_enabled and '6.3.1' not in (cis_exception_ids | default([]))"
  tags: [cis_6_3_1, cis_logging]

- name: 6.3.1 | the AIDE database is built (once)
  ansible.builtin.command:
    cmd: aideinit -y -f
    creates: /var/lib/aide/aide.db
  when: "cis_logging_aide_enabled and '6.3.1' not in (cis_exception_ids | default([]))"
  tags: [cis_6_3_1, cis_logging, molecule-notest]

- name: 6.3.2 | filesystem integrity is checked daily
  ansible.builtin.systemd_service:
    name: dailyaidecheck.timer
    enabled: true
    state: started
  when: "cis_logging_aide_enabled and '6.3.2' not in (cis_exception_ids | default([]))"
  tags: [cis_6_3_2, cis_logging, molecule-notest]

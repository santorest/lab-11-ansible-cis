- name: 4.2.1 | ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  when: "'4.2.1' not in cis_exception_ids"
  tags: [cis_4_2_1, cis_firewall]

- name: 4.2.2 | iptables-persistent is not installed alongside ufw
  ansible.builtin.apt:
    name: iptables-persistent
    state: absent
  when: "'4.2.2' not in cis_exception_ids"
  tags: [cis_4_2_2, cis_firewall]

- name: 4.2.4 | loopback traffic is allowed and spoofed loopback is denied
  community.general.ufw:
    rule: "{{ item.rule }}"
    direction: "{{ item.direction }}"
    interface: "{{ item.interface | default(omit) }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
  loop:
    - {rule: allow, direction: in, interface: lo}
    - {rule: allow, direction: out, interface: lo}
    - {rule: deny, direction: in, from_ip: 127.0.0.0/8}
    - {rule: deny, direction: in, from_ip: "::1"}
  when: "'4.2.4' not in cis_exception_ids"
  tags: [cis_4_2_4, cis_firewall, molecule-notest]

- name: 4.2.5 | outbound traffic the host needs is allowed (before the default deny)
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ cis_firewall_allow_out }}"
  when: "'4.2.5' not in cis_exception_ids"
  tags: [cis_4_2_5, cis_firewall, molecule-notest]

- name: 4.2.6 | ports listening on non-loopback addresses (find)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ss -H -tuln | awk '{print $1, $5}' \
        | grep -vE ' (127\.[0-9.]+|\[::1\]|\[::ffff:127\.[0-9.]+\]):[0-9]+$' \
        | sed -E 's/^(tcp|udp) .*:([0-9]+)$/\2\/\1/' | sort -u
    executable: /bin/bash
  register: cis_open_ports
  changed_when: false
  when: "'4.2.6' not in cis_exception_ids"
  tags: [cis_4_2_6, cis_firewall, molecule-notest]

- name: 4.2.6 | every open port has an inbound rule
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ cis_open_ports.stdout_lines | default([]) }}"
  when: "'4.2.6' not in cis_exception_ids"
  tags: [cis_4_2_6, cis_firewall, molecule-notest]

- name: 4.2.7 | default deny policy for incoming, outgoing and routed traffic
  community.general.ufw:
    direction: "{{ item }}"
    default: deny
  loop: [incoming, outgoing, routed]
  when: "'4.2.7' not in cis_exception_ids"
  tags: [cis_4_2_7, cis_firewall, molecule-notest]

- name: 4.2.3 | ufw is enabled
  community.general.ufw:
    state: enabled
  when: "'4.2.3' not in cis_exception_ids"
  tags: [cis_4_2_3, cis_firewall, molecule-notest]

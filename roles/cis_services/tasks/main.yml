- name: 2.1.x | Server services that are not needed are removed
  ansible.builtin.apt:
    name: "{{ cis_services_server_packages }}"
    state: absent
    purge: true
  when: "'2.1' not in (cis_exception_ids | default([]))"
  tags: [cis_2_1, cis_services]

- name: 2.2.x | Insecure clients are removed
  ansible.builtin.apt:
    name: "{{ cis_services_client_packages }}"
    state: absent
    purge: true
  when: "'2.2' not in (cis_exception_ids | default([]))"
  tags: [cis_2_2, cis_services]

- name: 2.3.1.1 | A single time synchronization daemon - systemd-timesyncd, chrony removed
  ansible.builtin.apt:
    name: chrony
    state: absent
    purge: true
  when: "'2.3.1.1' not in (cis_exception_ids | default([]))"
  tags: [cis_2_3_1_1, cis_services]

- name: 2.3.1.1 | systemd-timesyncd is installed
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  when: "'2.3.1.1' not in (cis_exception_ids | default([]))"
  tags: [cis_2_3_1_1, cis_services]

- name: 2.3.2.1 | the timesyncd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'2.3.2.1' not in (cis_exception_ids | default([]))"
  tags: [cis_2_3_2_1, cis_services]

- name: 2.3.2.1 | systemd-timesyncd uses the authorized time servers
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/60-cis.conf
    content: |
      [Time]
      NTP={{ cis_services_time_servers[:2] | join(' ') }}
      FallbackNTP={{ cis_services_time_servers[2:] | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  register: cis_services_timesyncd_conf
  when: "'2.3.2.1' not in (cis_exception_ids | default([]))"
  tags: [cis_2_3_2_1, cis_services]

- name: 2.3.2.x | systemd-timesyncd is enabled and running
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: "{{ 'restarted' if cis_services_timesyncd_conf is changed else 'started' }}"
  when: "'2.3.2' not in (cis_exception_ids | default([]))"
  tags: [cis_2_3_2, cis_services, molecule-notest]

- name: 2.4.1.x | cron files and directories are root-only
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/crontab, mode: "0600"}
    - {path: /etc/cron.hourly, mode: "0700"}
    - {path: /etc/cron.daily, mode: "0700"}
    - {path: /etc/cron.weekly, mode: "0700"}
    - {path: /etc/cron.monthly, mode: "0700"}
    - {path: /etc/cron.d, mode: "0700"}
  when: "'2.4.1' not in (cis_exception_ids | default([]))"
  tags: [cis_2_4_1, cis_services]

- name: 2.4.1.8 / 2.4.2.1 | cron and at are restricted to authorized users
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "root\n"
    owner: root
    group: "{{ item.group }}"
    mode: "0640"
  loop:
    - {path: /etc/cron.allow, group: crontab}
    - {path: /etc/at.allow, group: root}
  when: "'2.4.1.8' not in (cis_exception_ids | default([]))"
  tags: [cis_2_4_1_8, cis_services]

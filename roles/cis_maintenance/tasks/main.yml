- name: 7.1.x | permissions on account files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/passwd, group: root, mode: "0644"}
    - {path: /etc/group, group: root, mode: "0644"}
    - {path: /etc/shadow, group: shadow, mode: "0640"}
    - {path: /etc/gshadow, group: shadow, mode: "0640"}
    - {path: /etc/shells, group: root, mode: "0644"}
  when: "'7.1' not in (cis_exception_ids | default([]))"
  tags: [cis_7_1, cis_maintenance]

# Filesystem-wide fixes run as one find -exec ... {} + each: a runner image has tens of thousands of matches
# (toolchains, miniconda), and one module call per file took more than 50 minutes. Each command prints how many
# paths it fixed; a second run finds none, so it reports no change.
- name: 7.1.11 | world-writable files on local filesystems lose the write bit for others
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find / -xdev -type f -perm -0002 -not -path "/proc/*" -not -path "/sys/*" -print -exec chmod o-w {} + | wc -l
    executable: /bin/bash
  register: cis_maintenance_ww_files
  changed_when: cis_maintenance_ww_files.stdout | int > 0
  when: "'7.1.11' not in (cis_exception_ids | default([]))"
  tags: [cis_7_1_11, cis_maintenance, molecule-notest]

- name: 7.1.11 | world-writable directories get the sticky bit
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find / -xdev -type d -perm -0002 ! -perm -1000 -print -exec chmod o+t {} + | wc -l
    executable: /bin/bash
  register: cis_maintenance_ww_dirs
  changed_when: cis_maintenance_ww_dirs.stdout | int > 0
  when: "'7.1.11' not in (cis_exception_ids | default([]))"
  tags: [cis_7_1_11, cis_maintenance, molecule-notest]

- name: 7.1.12 | files without an owner or group on local filesystems are given to root
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find / -xdev \( -nouser -o -nogroup \) -not -path "/proc/*" -print -exec chown -h root:root {} + | wc -l
    executable: /bin/bash
  register: cis_maintenance_unowned
  changed_when: cis_maintenance_unowned.stdout | int > 0
  when: "'7.1.12' not in (cis_exception_ids | default([]))"
  tags: [cis_7_1_12, cis_maintenance, molecule-notest]

- name: 7.2.10 | user dot files writable by group or others (find)
  ansible.builtin.command: find /root /home -maxdepth 2 -name ".*" -type f -perm /go+w
  register: cis_maintenance_dotfiles
  changed_when: false
  when: "'7.2.10' not in (cis_exception_ids | default([]))"
  tags: [cis_7_2_10, cis_maintenance]

- name: 7.2.10 | user dot files are not writable by group or others
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "go-w"
  loop: "{{ cis_maintenance_dotfiles.stdout_lines | default([]) }}"
  when: "'7.2.10' not in (cis_exception_ids | default([]))"
  tags: [cis_7_2_10, cis_maintenance]

- name: 7.2.x | no account has an empty password field (check)
  ansible.builtin.command:
    argv: [awk, "-F:", '($2 == "") {print $1}', /etc/shadow]
  register: cis_maintenance_empty_pw
  changed_when: false
  failed_when: cis_maintenance_empty_pw.stdout | length > 0
  tags: [cis_7_2, cis_maintenance]

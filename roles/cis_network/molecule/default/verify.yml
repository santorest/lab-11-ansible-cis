- name: Verify cis_network
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read /etc/modprobe.d/cis-sctp.conf
      ansible.builtin.slurp:
        src: /etc/modprobe.d/cis-sctp.conf
      register: cis_network_check_0
    - name: /etc/modprobe.d/cis-sctp.conf contains the expected setting
      ansible.builtin.assert:
        that:
          - >-
            'install sctp /bin/false' in (cis_network_check_0.content | b64decode)

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
# Not watched on purpose: the SSG release (policy/policy.yml) and the Molecule image digest are bumped by hand and
# proven with a real hardening run.

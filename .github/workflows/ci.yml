name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"     # weekly
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-ansible.txt && pip install --no-deps -e .
      - run: ansible-galaxy collection install -r requirements.yml -p .ansible/collections
      - run: yamllint .
      - run: ansible-lint
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: shellcheck scripts/*.sh

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: pytest --cov=cisreport --cov-report=term-missing --cov-fail-under=90

  molecule-role:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [cis_initial_setup, cis_services, cis_network, cis_firewall, cis_access, cis_logging, cis_maintenance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ansible.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - name: molecule test (${{ matrix.role }})
        run: cd roles/${{ matrix.role }} && molecule test

  molecule:
    runs-on: ubuntu-24.04
    needs: molecule-role
    if: always()
    steps:
      - name: Every role passed Molecule
        run: test "${{ needs.molecule-role.result }}" = success

  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-ansible.txt && pip install --no-deps -e .
      - name: Scan, harden, harden again, scan, report, gate
        run: bash scripts/run-hardening.sh
      - name: Summary
        if: always()
        run: if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hardening-results
          path: |
            out/*.html
            out/*.xml
            out/*.json
            out/*.md
            out/*-run.log
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history, pinned by digest)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --verbose --exit-code 1
